<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Note Digitizer</title>
<style>
  :root { --bg:#fff; --fg:#1a1a1a; --muted:#6b6b6b; --line:#e2e2e2; --code:#f5f5f5; --accent:#c96442; --err:#d33; }
  @media (prefers-color-scheme: dark) { :root { --bg:#161616; --fg:#ececec; --muted:#9a9a9a; --line:#333; --code:#222; } }
  * { box-sizing: border-box; }
  body { margin:0; padding:16px; background:var(--bg); color:var(--fg); font:16px/1.5 -apple-system, system-ui, sans-serif; }
  main { max-width: 760px; margin: 0 auto; }
  h1 { font-size: 20px; margin: 0 0 12px; }
  button { font:inherit; padding:10px 16px; border:0; border-radius:8px; background:var(--accent); color:#fff; cursor:pointer; }
  button.ghost { background:var(--code); color:var(--fg); border:1px solid var(--line); padding:4px 10px; font-size:13px; }
  button:disabled { opacity:.5; }
  .row { display:flex; gap:8px; flex-wrap:wrap; align-items:center; margin:12px 0; }
  #previewWrap { position:relative; display:none; width:fit-content; max-width:100%; }
  #preview { display:block; max-width:100%; max-height:240px; border-radius:8px; border:1px solid var(--line); }
  #remove { position:absolute; top:6px; right:6px; width:30px; height:30px; padding:0; border-radius:50%; background:rgba(0,0,0,.65); font-size:18px; line-height:1; }
  #status { color:var(--muted); }
  .error { color:var(--err); }
  section { margin-top:20px; display:none; }
  h2 { font-size:15px; color:var(--muted); margin:0 0 6px; display:flex; justify-content:space-between; align-items:center; }
  pre, #log { margin:0; padding:12px; background:var(--code); border:1px solid var(--line); border-radius:8px; overflow:auto; white-space:pre-wrap; word-break:break-word; font:13px/1.45 ui-monospace, Menlo, monospace; }
  #log { max-height:260px; }
  #log .think { color:var(--muted); font-style:italic; }
  #log .tool { color:var(--accent); }
  #log .out { color:var(--fg); }
  #diagram { padding:12px; border:1px solid var(--line); border-radius:8px; overflow:auto; text-align:center; }
  #rendered { border:1px solid var(--line); border-radius:8px; padding:4px 12px; }
  table { border-collapse:collapse; width:100%; font-size:14px; }
  td { padding:4px 8px; border-bottom:1px solid var(--line); }
  td:last-child { text-align:right; font-variant-numeric:tabular-nums; }
  .note { color:var(--muted); font-size:12px; margin-top:6px; }
</style>
</head>
<body>
<main>
  <h1>Note Digitizer</h1>
  <input id="file" type="file" accept="image/*" hidden>
  <div class="row">
    <button id="pick">Choose photo</button>
    <button id="go" disabled>Digitize</button>
    <span id="status"></span>
  </div>
  <div id="previewWrap"><img id="preview" alt=""><button id="remove" aria-label="Remove photo">×</button></div>

  <section id="s-log"><h2>Progress</h2><div id="log"></div></section>
  <section id="s-diagram"><h2>Diagram</h2><div id="diagram"></div></section>
  <section id="s-mermaid"><h2>Mermaid code <button class="ghost" data-copy="mermaid">Copy</button></h2><pre id="mermaid-code"></pre></section>
  <section id="s-md"><h2>Markdown <button class="ghost" data-copy="md">Copy</button></h2><pre id="md-code"></pre></section>
  <section id="s-rendered"><h2>Rendered</h2><div id="rendered"></div></section>
  <section id="s-stats"><h2>Run stats</h2><table id="stats"></table><div class="note">Cost is the API-equivalent price. On a subscription login nothing is billed per token; it counts against your plan limits.</div></section>
</main>

<script src="/vendor/mermaid.js"></script>
<script src="/vendor/marked.js"></script>
<script>
  const $ = (id) => document.getElementById(id);
  const fileInput = $("file"), go = $("go"), statusEl = $("status"), logEl = $("log");
  const SECTIONS = ["s-log", "s-diagram", "s-mermaid", "s-md", "s-rendered", "s-stats"];
  let md = "", mmd = "", running = false;
  const dark = matchMedia("(prefers-color-scheme: dark)").matches;
  mermaid.initialize({ startOnLoad: false, theme: dark ? "dark" : "default", securityLevel: "strict" });

  const setStatus = (text, isError) => { statusEl.className = isError ? "error" : ""; statusEl.textContent = text; };

  $("pick").onclick = () => fileInput.click();
  fileInput.onchange = () => {
    const f = fileInput.files[0];
    if (!f) return;
    $("preview").src = URL.createObjectURL(f);
    $("previewWrap").style.display = "block";
    go.disabled = false;
    setStatus("");
  };
  $("remove").onclick = () => {
    fileInput.value = "";
    $("preview").removeAttribute("src");
    $("previewWrap").style.display = "none";
    go.disabled = true;
    setStatus("");
  };

  // Log block that keeps appending to the same element while the stream stays in one kind.
  let lastKind = null, lastEl = null;
  function logAppend(kind, text) {
    if (kind !== lastKind) {
      lastEl = document.createElement("div");
      lastEl.className = kind;
      logEl.appendChild(lastEl);
      lastKind = kind;
    }
    lastEl.textContent += text;
    logEl.scrollTop = logEl.scrollHeight;
  }
  const logLine = (kind, text) => { logAppend(kind, text); lastKind = null; };

  go.onclick = async () => {
    const f = fileInput.files[0];
    if (!f || running) return;
    running = true;
    go.disabled = true;
    SECTIONS.forEach((id) => ($(id).style.display = "none"));
    logEl.textContent = "";
    lastKind = null;
    $("s-log").style.display = "block";
    setStatus("Working...");
    const t0 = Date.now();
    const timer = setInterval(() => setStatus(`Working... ${Math.round((Date.now() - t0) / 1000)}s`), 500);
    try {
      const fd = new FormData();
      fd.append("photo", f);
      const res = await fetch("/digitize", { method: "POST", body: fd });
      if (!res.ok) throw new Error((await res.json()).error || res.statusText);
      let finished = false;
      await readSse(res, async (ev) => {
        if (ev.kind === "init") logLine("tool", `model: ${ev.model} | auth: ${ev.apiKeySource}\n`);
        else if (ev.kind === "thinking") logAppend("think", ev.text);
        else if (ev.kind === "rejected") { finished = true; showStats(ev.stats); throw new Error("Not handwriting: " + ev.reason); }
        else if (ev.kind === "result") { finished = true; await show(ev.markdown); showStats(ev.stats); setStatus("Done"); }
        else if (ev.kind === "error") throw new Error(ev.message);
      });
      if (!finished) throw new Error("Stream ended without result");
    } catch (e) {
      setStatus(e.message, true);
    } finally {
      clearInterval(timer);
      running = false;
      go.disabled = !fileInput.files[0];
    }
  };

  async function readSse(res, onEvent) {
    const reader = res.body.getReader();
    const dec = new TextDecoder();
    let buf = "";
    for (;;) {
      const { value, done } = await reader.read();
      if (done) break;
      buf += dec.decode(value, { stream: true });
      let i;
      while ((i = buf.indexOf("\n\n")) >= 0) {
        const chunk = buf.slice(0, i);
        buf = buf.slice(i + 2);
        const line = chunk.split("\n").find((l) => l.startsWith("data:"));
        if (line) await onEvent(JSON.parse(line.slice(5).trim()));
      }
    }
  }

  async function show(markdown) {
    md = markdown.trim();
    const m = md.match(/```mermaid\s*\n([\s\S]*?)```/);
    mmd = m ? m[1].trim() : "";
    $("md-code").textContent = md;
    $("s-md").style.display = "block";
    $("rendered").innerHTML = marked.parse(md);
    $("s-rendered").style.display = "block";
    if (mmd) {
      $("mermaid-code").textContent = mmd;
      $("s-mermaid").style.display = "block";
      try {
        const { svg } = await mermaid.render("d" + Date.now(), mmd);
        $("diagram").innerHTML = svg;
      } catch (e) {
        $("diagram").textContent = "Mermaid syntax error: " + e.message;
      }
      $("s-diagram").style.display = "block";
    }
  }

  function showStats(s) {
    if (!s) return;
    const t = s.tokens;
    const n = (x) => (x ?? 0).toLocaleString("en-US");
    const sec = (ms) => (ms / 1000).toFixed(1) + " s";
    const models = s.byModel.map((m) => `${m.model}: $${m.costUsd.toFixed(4)}`).join(", ");
    const rows = [
      ["Wall time", sec(s.wallMs)],
      ["API time", sec(s.apiMs)],
      ["Turns", s.turns],
      ["Input tokens", n(t.input)],
      ["Output tokens", n(t.output) + (t.thinking ? ` (${n(t.thinking)} thinking)` : "")],
      ["Cache read tokens", n(t.cacheRead)],
      ["Cache write tokens", n(t.cacheWrite)],
      ["API-equivalent cost", "$" + s.costUsd.toFixed(4)],
    ];
    if (models) rows.push(["By model", models]);
    $("stats").innerHTML = rows.map(([k, v]) => `<tr><td>${k}</td><td>${v}</td></tr>`).join("");
    $("s-stats").style.display = "block";
  }

  document.querySelectorAll("[data-copy]").forEach((b) => {
    b.onclick = async () => {
      const text = b.dataset.copy === "md" ? md : mmd;
      try {
        await navigator.clipboard.writeText(text);
      } catch {
        // clipboard API needs a secure context; plain http over LAN falls back to execCommand
        const ta = document.createElement("textarea");
        ta.value = text;
        document.body.appendChild(ta);
        ta.select();
        document.execCommand("copy");
        ta.remove();
      }
      const old = b.textContent;
      b.textContent = "Copied";
      setTimeout(() => (b.textContent = old), 1200);
    };
  });
</script>
</body>
</html>
